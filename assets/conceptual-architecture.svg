<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">JARVIS / AIOps — Conceptual Engineering Showcase</title>
<desc id="desc">Public sanitized diagram: JARVIS interface research, local AI and agent experiments, AIOps observability research, and separately governed security and human approval. All concepts, no live system details.</desc>
